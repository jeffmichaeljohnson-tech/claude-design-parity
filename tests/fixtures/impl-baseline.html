<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design baseline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b1220;
        color: #f3f6fc;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .card {
        width: 320px;
        margin: 40px auto;
        padding: 24px;
        background: #1a2540;
        border-radius: 12px;
        border: 1px solid #2a3a60;
      }
      .card h1 {
        margin: 0 0 12px 0;
        font-size: 20px;
        font-weight: 600;
      }
      .card p {
        margin: 0;
        line-height: 1.5;
        color: #c5cfe6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Baseline card</h1>
      <p>This is the visual baseline used by the smoke test.</p>
    </div>
  </body>
</html>
