<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design baseline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .card {
        width: 320px;
        margin: 40px auto;
        padding: 24px;
        background: #ff3b30;
        border-radius: 0;
        border: 4px solid #000000;
      }
      .card h1 {
        margin: 0 0 12px 0;
        font-size: 20px;
        font-weight: 600;
        color: #ffffff;
      }
      .card p {
        margin: 0;
        line-height: 1.5;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Regressed card</h1>
      <p>The colors and border on this page are visibly different.</p>
    </div>
  </body>
</html>
