name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Smoke tests
        run: npm test

      - name: Script help check
        run: node scripts/parity-screenshot-diff.mjs --help

      - name: Emdash scan
        run: |
          set -e
          MATCHES=$(grep -rn $'\xe2\x80\x94' \
            --include='*.md' --include='*.mjs' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' \
            --exclude-dir=node_modules \
            . || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Emdash characters found. Replace with periods, parentheses, or restructure."
            echo "$MATCHES"
            exit 1
          fi
          echo "No emdashes found."
